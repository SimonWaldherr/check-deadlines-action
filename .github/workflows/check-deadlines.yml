name: Check Deadlines

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 13 * * 5'

permissions:
  contents: read

jobs:
  check-deadlines:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type-check, build, and test
      run: npm test

    - name: Verify committed action bundle
      run: git diff --exit-code -- dist/index.js

    - name: Run Check Deadlines Action
      uses: ./
      with:
        dir: '.'
