name: 'Check Deadlines'
description: 'A tool to check for deadlines in source code.'
branding:
  icon: 'search'
  color: 'orange'
inputs:
  dir:
    description: 'The directory to search for deadlines'
    required: false
    default: '.'
  warn-only:
    description: 'Emit warnings without failing the action when deadlines are exceeded'
    required: false
    default: 'false'
  warning-days:
    description: 'Number of days before the deadline to start emitting warning notices'
    required: false
    default: '7'
  exclude:
    description: 'Comma-separated list of directory or file names to exclude from scanning. node_modules and dist are always skipped.'
    required: false
    default: ''
runs:
  using: 'node20'
  main: 'dist/index.js'
